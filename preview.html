
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview Surat · Dinas Kependudukan dan Pencatatan Sipil Kabupaten Tuban</title>
<link rel="stylesheet" href="style.css">
<style>
  .preview-page {
    min-height: 100vh;
    background: #dfe8e2;
    padding: 30px 20px 60px;
  }
  .preview-shell { max-width: 900px; margin: 0 auto; }
  .preview-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }
  .preview-header > div:nth-child(2) { text-align: center; }
  .preview-header .btn-ghost:first-child { justify-self: start; }
  .preview-actions {
    display: flex;
    gap: 10px;
    justify-self: end;
    flex-wrap: wrap;
  }
  .preview-eyebrow {
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .preview-title {
    margin: 5px 0 0;
    font-family: 'Manrope', sans-serif;
    font-size: 24px;
    letter-spacing: -.03em;
    color: var(--ink);
  }
  .archive-note,
  .attachment-note {
    margin: 16px 0 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .attachment-note a { color: var(--green); font-weight: 700; }

  .preview-shell .paper {
    margin: 0 auto;
    width: 794px;
    min-height: 1123px;
    max-width: 100%;
  }

  .paper-kop {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 0 18px;
    object-fit: contain;
  }
  .paper-kop[hidden] { display: none; }

  @media (max-width: 850px) {
    .preview-header { grid-template-columns: 1fr; gap: 12px; text-align: left; }
    .preview-header > div:nth-child(2) { text-align: left; }
    .preview-actions { justify-self: stretch; width: 100%; }
    .preview-shell .paper {
      width: 100%;
      min-height: auto;
      padding: 40px 24px;
    }
  }

  @media print {
    .preview-page { background: #fff; padding: 0; }
    .preview-header,
    .archive-note,
    .attachment-note { display: none; }
    .preview-shell .paper {
      box-shadow: none;
      width: 100%;
      min-height: auto;
      margin: 0;
    }
  }
</style>
</head>
<body class="preview-page">
<div class="preview-shell">
  <header class="preview-header">
    <a href="form.html" class="btn btn-ghost">← Kembali</a>
    <div>
      <div class="preview-eyebrow">Surat siap diperiksa</div>
      <h1 class="preview-title">Preview Surat</h1>
    </div>
    <div class="preview-actions">
      <button class="btn btn-ghost" id="dashboard-button" type="button">Dashboard</button>
      <button class="btn btn-primary" id="save-button" type="button">Simpan</button>
      <button class="btn btn-primary" id="print-button" type="button">Cetak / PDF</button>
    </div>
  </header>

  <main class="paper" id="paper">
    <!-- Foto kop utuh (hanya muncul kalau mode foto) -->
    <img id="paper-kop" class="paper-kop" alt="Kop Surat" hidden>

    <!-- Konten surat (kop terstruktur / identitas / isi / ttd semua di sini) -->
    <section id="letter-content" class="letter-content"></section>
  </main>

  <p class="archive-note" id="archive-note"></p>
  <p class="attachment-note" id="attachment-note"></p>
</div>

<script src="data.js"></script>
<script>
  /* =========================================================
     PREVIEW.HTML
     - Kop terstruktur sudah ada di dalam template.template
       → tidak perlu dirender ulang, langsung tampil via letter-content
     - Kop foto utuh disimpan di template.kop_foto_url
       → tampil sebagai <img> besar di atas .letter-content
     ========================================================= */

  const session = getSession();

  if (!session.pembuat || !session.template_key || !session.signer_nama || !session.data || !session.nomor_surat) {
    location.href = !session.pembuat
      ? "index.html"
      : (!session.template_key
        ? "jenis.html"
        : (!session.signer_nama ? "penandatangan.html" : "form.html"));
    throw new Error("Redirect");
  }

  const template = getTemplates().find((item) => item.key === session.template_key);
  if (!template) {
    location.href = "jenis.html";
    throw new Error("Template not found");
  }

  // =========================================================
  // 1. RENDER ISI SURAT
  // =========================================================
  const renderedHtml = (typeof renderTemplate === "function")
    ? renderTemplate(template.template, { ...session.data, nomor_surat: session.nomor_surat })
    : template.template;

  document.getElementById("letter-content").innerHTML = renderedHtml;

  // =========================================================
  // 2. KOP FOTO UTUH
  //    Hanya tampil kalau template dibuat di mode "foto utuh".
  //    Kop terstruktur sudah ada di dalam template.template,
  //    jadi tidak perlu ini.
  // =========================================================
  if (template.kop_foto_url) {
    const kop = document.getElementById("paper-kop");
    kop.src = template.kop_foto_url;
    kop.hidden = false;
  }

  // =========================================================
  // 3. QR TTE — kalau belum inline, isi dari signature_qr_url
  // =========================================================
  if (template.signature_qr_url) {
    document.querySelectorAll(".official-qr, .ttd-qr").forEach((qr) => {
      const src = qr.getAttribute("src") || "";
      if (!src || src.trim() === "") qr.src = template.signature_qr_url;
    });
  }

  // =========================================================
  // 4. Layout khusus (opsional)
  // =========================================================
  if (template.key === "dummy_keabsahan_akta_blitar" || template.layout === "official") {
    document.getElementById("paper").classList.add("official-paper");
  }

  // =========================================================
  // 5. SIMPAN ARSIP
  // =========================================================
  const letter = upsertLetter({
    id: session.letter_id,
    template_key: session.template_key,
    created_by: session.pembuat.nama,
    created_by_detail: { jabatan: session.pembuat.jabatan },
    signer_mode: session.signer_mode,
    signer_id: session.signer_id,
    signer_nama: session.signer_nama,
    signer_jabatan: session.signer_jabatan,
    signer_nip: session.signer_nip,
    nomor_surat: session.nomor_surat,
    data: session.data,
    attachment: session.attachment || null,
    status: "final"
  });

  patchSession({ letter_id: letter.id });
  document.getElementById("archive-note").textContent =
    `Surat ${letter.id} otomatis tersimpan di arsip.`;

  if (session.attachment?.data_url) {
    const a = document.createElement("a");
    a.href = session.attachment.data_url;
    a.download = session.attachment.name;
    a.textContent = `Lampiran: ${session.attachment.name} (buka/unduh)`;
    document.getElementById("attachment-note").append("Surat pendamping tersedia. ", a);
  }

  // =========================================================
  // 6. TOMBOL
  // =========================================================
  document.getElementById("save-button").addEventListener("click", () => {
    upsertLetter({
      id: letter.id,
      template_key: session.template_key,
      created_by: session.pembuat.nama,
      created_by_detail: { jabatan: session.pembuat.jabatan },
      signer_mode: session.signer_mode,
      signer_id: session.signer_id,
      signer_nama: session.signer_nama,
      signer_jabatan: session.signer_jabatan,
      signer_nip: session.signer_nip,
      nomor_surat: session.nomor_surat,
      data: session.data,
      attachment: session.attachment || null,
      status: "final"
    });
    location.href = "index.html";
  });

  document.getElementById("dashboard-button").addEventListener("click", () => {
    location.href = "index.html";
  });

  document.getElementById("print-button").addEventListener("click", () => window.print());
</script>
</body>
</html>
