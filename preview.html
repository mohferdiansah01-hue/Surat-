<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview Surat · Dinas Kependudukan dan Pencatatan Sipil Kabupaten Tuban</title>
<link rel="stylesheet" href="style.css">
<style>
  /* =========================================================
     PREVIEW PAGE — Sticky topbar + kertas
     ========================================================= */
  .preview-page {
    min-height: 100vh;
    background: #dfe8e2;
    padding: 0;
  }

  /* ---------- STICKY TOP BAR ---------- */
  .preview-topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 12px rgba(24, 69, 51, .06);
  }
  .preview-topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* Sisi kiri: tombol kembali + breadcrumb */
  .preview-topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .preview-breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preview-breadcrumb strong {
    color: var(--ink);
    font-weight: 700;
  }

  /* Sisi kanan: aksi */
  .preview-topbar-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ---------- TOMBOL ---------- */
  .btn-nav,
  .btn-outline,
  .btn-primary-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 38px;
    padding: 8px 15px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.2;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: background .18s, border-color .18s, color .18s, box-shadow .18s, transform .1s;
  }
  .btn-nav {
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
  }
  .btn-nav:hover {
    background: var(--mist);
    border-color: #b9d2c4;
  }
  .btn-outline {
    color: var(--green-dark);
    background: var(--paper);
    border: 1.5px solid var(--green);
  }
  .btn-outline:hover {
    background: #eef8f1;
    border-color: var(--green-dark);
  }
  .btn-primary-action {
    color: #fff;
    background: var(--green);
    border: 1.5px solid var(--green);
    box-shadow: 0 4px 12px rgba(23, 123, 92, .22);
  }
  .btn-primary-action:hover {
    background: var(--green-dark);
    border-color: var(--green-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(23, 123, 92, .28);
  }
  .btn-primary-action:active { transform: translateY(0); }

  .btn-nav svg,
  .btn-outline svg,
  .btn-primary-action svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- SHELL ---------- */
  .preview-shell {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* Judul halaman */
  .preview-hero {
    text-align: center;
    margin-bottom: 24px;
  }
  .preview-eyebrow {
    color: var(--green);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .preview-title {
    margin: 6px 0 0;
    font-family: 'Manrope', sans-serif;
    font-size: 26px;
    letter-spacing: -.03em;
    color: var(--ink);
  }

  /* ---------- KERTAS ---------- */
  .preview-shell .paper {
    margin: 0 auto;
    width: 794px;
    min-height: 1123px;
    max-width: 100%;
  }
  .paper-kop {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 0 18px;
    object-fit: contain;
  }
  .paper-kop[hidden] { display: none; }

  /* ---------- CATATAN ---------- */
  .archive-note,
  .attachment-note {
    margin: 16px 0 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .attachment-note a { color: var(--green); font-weight: 700; }

  /* =========================================================
     RESPONSIVE
     ========================================================= */

  /* Tablet — breadcrumb disembunyikan, tombol tetap 1 baris */
  @media (max-width: 850px) {
    .preview-topbar-inner { padding: 10px 16px; }
    .preview-breadcrumb { display: none; }
    .preview-shell { padding: 22px 14px 50px; }
    .preview-title { font-size: 22px; }
    .preview-shell .paper { width: 100%; min-height: auto; padding: 40px 24px; }
  }

  /* Tablet kecil — tombol dipecah 2 baris untuk kenyamanan */
  @media (max-width: 640px) {
    .preview-topbar-inner {
      padding: 10px 14px;
      gap: 10px;
    }
    .preview-topbar-left {
      flex: 1 1 100%;
    }
    .preview-topbar-left .btn-nav {
      width: 100%;
      justify-content: flex-start;
    }
    .preview-topbar-actions {
      flex: 1 1 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .preview-topbar-actions .btn-primary-action {
      grid-column: 1 / -1;
    }
  }

  /* HP — semua full width */
  @media (max-width: 420px) {
    .preview-topbar-actions {
      grid-template-columns: 1fr;
    }
    .preview-topbar-actions .btn-primary-action {
      grid-column: span 1;
    }
    .preview-title { font-size: 20px; }
  }

  @media print {
    .preview-page { background: #fff; padding: 0; }
    .preview-topbar,
    .preview-hero,
    .archive-note,
    .attachment-note { display: none; }
    .preview-shell { padding: 0; max-width: none; }
    .preview-shell .paper { box-shadow: none; width: 100%; min-height: auto; margin: 0; padding: 0; }
  }
</style>
</head>
<body class="preview-page">

  <!-- ============================================================
       STICKY TOP BAR — selalu terlihat saat scroll
       ============================================================ -->
  <header class="preview-topbar">
    <div class="preview-topbar-inner">

      <!-- Kiri: tombol kembali + breadcrumb -->
      <div class="preview-topbar-left">
        <a href="form.html" class="btn-nav">
          <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Kembali
        </a>
        <nav class="preview-breadcrumb" aria-label="Breadcrumb">
          <span>Buat Surat</span>
          <span aria-hidden="true">›</span>
          <strong>Preview</strong>
        </nav>
      </div>

      <!-- Kanan: aksi -->
      <div class="preview-topbar-actions">
        <button class="btn-nav" id="dashboard-button" type="button">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Dashboard
        </button>
        <button class="btn-outline" id="save-button" type="button">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Simpan
        </button>
        <button class="btn-primary-action" id="print-button" type="button">
          <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Cetak / PDF
        </button>
      </div>

    </div>
  </header>

  <!-- ============================================================
       KONTEN
       ============================================================ -->
  <div class="preview-shell">

    <div class="preview-hero">
      <div class="preview-eyebrow">Surat siap diperiksa</div>
      <h1 class="preview-title">Preview Surat</h1>
    </div>

    <main class="paper" id="paper">
      <img id="paper-kop" class="paper-kop" alt="Kop Surat" hidden>
      <section id="letter-content" class="letter-content"></section>
    </main>

    <p class="archive-note" id="archive-note"></p>
    <p class="attachment-note" id="attachment-note"></p>
  </div>

<script src="data.js"></script>
<script>
  const session = getSession();

  if (!session.pembuat || !session.template_key || !session.signer_nama || !session.data || !session.nomor_surat) {
    location.href = !session.pembuat
      ? "index.html"
      : (!session.template_key
        ? "jenis.html"
        : (!session.signer_nama ? "penandatangan.html" : "form.html"));
    throw new Error("Redirect");
  }

  const template = getTemplates().find((item) => item.key === session.template_key);
  if (!template) {
    location.href = "jenis.html";
    throw new Error("Template not found");
  }

  // =========================================================
  // DATA PENANDATANGAN
  // =========================================================
  const signerFromStore = session.signer_id
    ? getDirut().find((s) => s.id === session.signer_id)
    : null;

  const signer = {
    nama:    signerFromStore?.nama    || session.signer_nama    || "",
    jabatan: signerFromStore?.jabatan || session.signer_jabatan || "",
    pangkat: signerFromStore?.pangkat || session.signer_pangkat || "",
    nip:     signerFromStore?.nip     || session.signer_nip     || "",
  };

  // =========================================================
  // DATA UNTUK RENDER TEMPLATE
  // =========================================================
  const templateData = {
    ...session.data,
    nomor_surat: session.nomor_surat,
    nama_penandatangan:    signer.nama,
    jabatan_penandatangan: signer.jabatan,
    pangkat_penandatangan: signer.pangkat,
    nip_penandatangan:     signer.nip,
  };

  const renderedHtml = (typeof renderTemplate === "function")
    ? renderTemplate(template.template, templateData)
    : template.template;

  document.getElementById("letter-content").innerHTML = renderedHtml;

  // =========================================================
  // KOP FOTO UTUH
  // =========================================================
  if (template.kop_foto_url) {
    const kop = document.getElementById("paper-kop");
    kop.src = template.kop_foto_url;
    kop.hidden = false;
  }

  // =========================================================
  // QR TTE
  // =========================================================
  if (template.signature_qr_url) {
    document.querySelectorAll(".official-qr, .ttd-qr").forEach((qr) => {
      const src = qr.getAttribute("src") || "";
      if (!src || src.trim() === "") qr.src = template.signature_qr_url;
    });
  }

  // =========================================================
  // Layout official
  // =========================================================
  if (template.key === "dummy_keabsahan_akta_blitar" || template.layout === "official") {
    document.getElementById("paper").classList.add("official-paper");
  }

  // =========================================================
  // SIMPAN ARSIP
  // =========================================================
  const letter = upsertLetter({
    id: session.letter_id,
    template_key: session.template_key,
    created_by: session.pembuat.nama,
    created_by_detail: { jabatan: session.pembuat.jabatan },
    signer_mode: session.signer_mode,
    signer_id: session.signer_id,
    signer_nama: signer.nama,
    signer_jabatan: signer.jabatan,
    signer_pangkat: signer.pangkat,
    signer_nip: signer.nip,
    nomor_surat: session.nomor_surat,
    data: session.data,
    attachment: session.attachment || null,
    status: "final"
  });

  patchSession({ letter_id: letter.id });
  document.getElementById("archive-note").textContent =
    `Surat ${letter.id} otomatis tersimpan di arsip.`;

  if (session.attachment?.data_url) {
    const a = document.createElement("a");
    a.href = session.attachment.data_url;
    a.download = session.attachment.name;
    a.textContent = `Lampiran: ${session.attachment.name} (buka/unduh)`;
    document.getElementById("attachment-note").append("Surat pendamping tersedia. ", a);
  }

  document.getElementById("save-button").addEventListener("click", () => {
    upsertLetter({
      id: letter.id,
      template_key: session.template_key,
      created_by: session.pembuat.nama,
      created_by_detail: { jabatan: session.pembuat.jabatan },
      signer_mode: session.signer_mode,
      signer_id: session.signer_id,
      signer_nama: signer.nama,
      signer_jabatan: signer.jabatan,
      signer_pangkat: signer.pangkat,
      signer_nip: signer.nip,
      nomor_surat: session.nomor_surat,
      data: session.data,
      attachment: session.attachment || null,
      status: "final"
    });
    location.href = "index.html";
  });

  document.getElementById("dashboard-button").addEventListener("click", () => {
    location.href = "index.html";
  });

  document.getElementById("print-button").addEventListener("click", () => window.print());
</script>
</body>
</html>
